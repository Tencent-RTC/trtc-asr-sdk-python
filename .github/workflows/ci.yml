name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.8" in pyproject.toml.
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    # ubuntu-latest is 26.04, for which actions/python-versions ships no 3.8 or
    # 3.9 build (setup-python fails before any test runs). Keep those two on
    # 24.04 so the oldest supported versions stay covered.
    runs-on: ${{ (matrix.python == '3.8' || matrix.python == '3.9') && 'ubuntu-24.04' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A broken sdist/wheel only shows up at publish time otherwise, which is
      # the worst moment to discover it.
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
